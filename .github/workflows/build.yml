name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Build debug APK (retry on repository 403)
        run: |
          for i in 1 2 3; do
            if gradle assembleDebug; then
              exit 0
            fi
            printf '%s\n' "attempt ${i} failed, waiting before retry"
            sleep 90
          done
          printf '%s\n' "all attempts failed"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: Sugoroku2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
