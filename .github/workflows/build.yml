name: Build check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - id: gradle1
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Wait before retrying Gradle provisioning
        if: steps.gradle1.outcome == 'failure'
        run: sleep 120
      - id: gradle2
        if: steps.gradle1.outcome == 'failure'
        uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Wait before final Gradle provisioning attempt
        if: steps.gradle1.outcome == 'failure' && steps.gradle2.outcome == 'failure'
        run: sleep 240
      - if: steps.gradle1.outcome == 'failure' && steps.gradle2.outcome == 'failure'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      # APK は release.yml が作る Release から配布する。
      # Artifacts は無料枠（0.5GB）を食いつぶすので upload-artifact は置かない。
      - name: Build debug APK (retry on repository 403)
        run: |
          for i in 1 2 3; do
            if gradle assembleDebug; then
              exit 0
            fi
            printf '%s\n' "attempt ${i} failed, waiting before retry"
            sleep 90
          done
          printf '%s\n' "all attempts failed"
          exit 1
